name: Build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure permanent APK signing
        if: github.event_name != 'pull_request'
        env:
          MYIPTV_KEYSTORE_BASE64: ${{ secrets.MYIPTV_KEYSTORE_BASE64 }}
          MYIPTV_KEYSTORE_PASSWORD: ${{ secrets.MYIPTV_KEYSTORE_PASSWORD }}
          MYIPTV_KEY_ALIAS: ${{ secrets.MYIPTV_KEY_ALIAS }}
          MYIPTV_KEY_PASSWORD: ${{ secrets.MYIPTV_KEY_PASSWORD }}
        run: |
          if [ -n "$MYIPTV_KEYSTORE_BASE64" ] && [ -n "$MYIPTV_KEYSTORE_PASSWORD" ] && [ -n "$MYIPTV_KEY_ALIAS" ] && [ -n "$MYIPTV_KEY_PASSWORD" ]; then
            printf '%s' "$MYIPTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myiptv.jks"
            chmod 600 "$RUNNER_TEMP/myiptv.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/myiptv.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$MYIPTV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$MYIPTV_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$MYIPTV_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using persistent MyIPTV signing certificate"
          else
            echo "::warning::Signing secrets not configured: debug APK will have a temporary certificate and cannot reliably upgrade an older APK."
          fi

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug and side-by-side QA APKs
        run: ./gradlew assembleDebug assembleQa --stacktrace

      # Publish the actual APK signer fingerprint for comparison across subsequent builds.
      # A SHA-256 certificate digest is public information; the private key remains secret.
      - name: Record APK signing fingerprint
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256 digest' | tee signing-fingerprint.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opentv-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/qa/*.apk
            signing-fingerprint.txt
          if-no-files-found: error

      # Publish direct, separately installable APK URLs only for this first-party QA PR.
      # Keep them explicitly marked as PRE-RELEASE until real-device testing is complete.
      - name: Publish direct APKs as an unmerged QA pre-release
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -1)
          QA_APK=$(find app/build/outputs/apk/qa -maxdepth 1 -name '*.apk' -type f | head -1)
          test -s "$DEBUG_APK"
          test -s "$QA_APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$DEBUG_APK" | grep -q "package: name='app.opentv.debug' versionCode='36'"
          "$AAPT" dump badging "$QA_APK" | grep -q "package: name='app.opentv.qa' versionCode='36'"
          mkdir -p direct-apks
          cp "$DEBUG_APK" direct-apks/KokyTV-v0.12.14-debug.apk
          cp "$QA_APK" direct-apks/KokyTV-v0.12.14-QA.apk
          git tag --list
          TAG="qa-v0.12.14-${HEAD_SHA:0:8}"
          gh release create "$TAG" direct-apks/*.apk --prerelease --target "$HEAD_SHA" \
            --title "Koky TV v0.12.14 (PR #6, unmerged QA)" \
            --notes "UNMERGED QA BUILD. For real-device testing only. Debug certificates are temporary and not upgrade compatible across runs. The separate Koky TV QA package does not overwrite the original debug installation. Keep saved data and keys backed up. See PR #6."
          echo "Direct APKs published at release tag: $TAG"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
