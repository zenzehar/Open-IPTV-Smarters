name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      # Never publish an installable release with a temporary runner debug identity.
      # Use the SAME four secrets as the main-branch build workflow.
      - name: Require permanent release signing
        env:
          MYIPTV_KEYSTORE_BASE64: ${{ secrets.MYIPTV_KEYSTORE_BASE64 }}
          MYIPTV_KEYSTORE_PASSWORD: ${{ secrets.MYIPTV_KEYSTORE_PASSWORD }}
          MYIPTV_KEY_ALIAS: ${{ secrets.MYIPTV_KEY_ALIAS }}
          MYIPTV_KEY_PASSWORD: ${{ secrets.MYIPTV_KEY_PASSWORD }}
        run: |
          if [ -z "$MYIPTV_KEYSTORE_BASE64" ] || [ -z "$MYIPTV_KEYSTORE_PASSWORD" ] || [ -z "$MYIPTV_KEY_ALIAS" ] || [ -z "$MYIPTV_KEY_PASSWORD" ]; then
            echo "::error::Configure all four MYIPTV signing secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$MYIPTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myiptv.jks"
          chmod 600 "$RUNNER_TEMP/myiptv.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/myiptv.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$MYIPTV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$MYIPTV_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$MYIPTV_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Assemble permanently signed release APK
        run: ./gradlew assembleRelease

      - name: Verify release APK certificate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256 digest'

      # A stable asset name matters: the install page and the /apk short link both look for
      # a file ending in .apk, and a predictable name keeps direct links working.
      - name: Name the artifact
        id: artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" "dist/opentv-${TAG}.apk"
          cp "$SOURCE" "dist/opentv.apk"
          echo "path=dist/opentv-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "signed=$([ -n "$KEYSTORE_PATH" ] && echo yes || echo debug-key)" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ ("^## " v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See the changelog for what is new in this release." > release-notes.md; fi
          {
            echo ""
            echo "---"
            echo "Built by GitHub Actions from the tagged commit — the workflow is public, so anyone can verify this APK against the source."
          } >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: false
          body_path: release-notes.md
